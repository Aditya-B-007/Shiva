<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiva AGI - Command Terminal</title>
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-sidebar: #121212;
            --bg-input: #1a1a1a;
            --text-main: #e5e5e5;
            --text-muted: #737373;
            --accent: #3b82f6; /* Blue for system */
            --success: #22c55e; /* Green for execution */
            --danger: #ef4444;
            --warning: #f59e0b;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        #sidebar { width: 320px; background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 1.5rem; border-right: 1px solid #262626; z-index: 10; }
        .sidebar-header { margin-bottom: 2rem; border-bottom: 1px solid #262626; padding-bottom: 1rem; }
        .sidebar-header h3 { font-family: var(--font-mono); font-size: 1.2rem; letter-spacing: 1px; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-right: 8px; box-shadow: 0 0 5px var(--danger); }
        .status-dot.online { background: var(--success); box-shadow: 0 0 5px var(--success); }
        
        .attach-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; opacity: 0.5; pointer-events: none; transition: opacity 0.3s; }
        .attach-box input { background: var(--bg-main); border: 1px solid #333; color: white; padding: 10px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.85rem; }
        .btn { background: var(--bg-input); color: white; border: 1px solid #333; padding: 10px; border-radius: 4px; cursor: pointer; font-family: var(--font-mono); font-size: 0.9rem; transition: 0.2s; text-align: center; text-transform: uppercase; letter-spacing: 1px;}
        .btn:hover { background: #262626; }
        .btn-primary { background: var(--accent); border: none; }
        .btn-primary:hover { background: #2563eb; }
        .btn-primary:disabled { background: #333; cursor: not-allowed; color: #737373; }

        #model-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .model-card { background: var(--bg-main); padding: 15px; border-radius: 4px; font-size: 0.85rem; border: 1px left solid #333; border-left: 3px solid var(--text-muted); }
        .model-card.active { border-left-color: var(--success); }
        .model-card h4 { margin-bottom: 6px; font-size: 0.95rem; font-family: var(--font-mono); }
        .model-card .meta { color: var(--text-muted); font-size: 0.75rem; margin-bottom: 10px; word-break: break-all; }
        .tag { background: #262626; padding: 2px 6px; border-radius: 2px; font-size: 0.7rem; margin-right: 4px; font-family: var(--font-mono); }

        /* --- MAIN TERMINAL AREA --- */
        #main-view { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        #top-bar { padding: 1rem 2rem; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: center; background: #121212; }
        .shiva-metrics { display: flex; gap: 1.5rem; font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-muted); }
        .metric span { font-weight: bold; color: var(--text-main); }

        /* Execution Log Styling */
        #execution-log { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.5; background: var(--bg-main); }
        
        .log-entry { display: flex; gap: 15px; padding: 8px 0; border-bottom: 1px dashed #262626; word-break: break-word; }
        .log-entry .timestamp { color: var(--text-muted); flex-shrink: 0; }
        .log-entry .source { font-weight: bold; flex-shrink: 0; width: 80px; }
        .log-entry .content { flex: 1; }
        
        .source-sys { color: var(--accent); }
        .source-usr { color: var(--warning); }
        .source-exe { color: var(--success); }
        .source-err { color: var(--danger); }

        /* Command Input Styling */
        #input-container { padding: 1.5rem 2rem; background: var(--bg-sidebar); border-top: 1px solid #262626; }
        .input-box { display: flex; align-items: center; background: var(--bg-main); border: 1px solid #333; border-radius: 4px; padding: 5px 15px; }
        .prompt-symbol { color: var(--success); font-family: var(--font-mono); font-weight: bold; margin-right: 15px; font-size: 1.2rem; }
        #directive-input { flex: 1; background: transparent; border: none; color: white; font-family: var(--font-mono); font-size: 1rem; padding: 10px 0; outline: none; }
        
        .empty-state { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; color: var(--text-muted); font-family: var(--font-mono); text-align: center; }
        .empty-state h1 { font-size: 1.5rem; color: var(--text-main); margin-bottom: 10px; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div class="sidebar-header">
            <h3><span id="indicator" class="status-dot"></span>SHIVA_AGI</h3>
            <button class="btn" style="width: 100%; margin-top: 15px;" onclick="pingShiva()">Initialize Daemon</button>
        </div>

        <div class="attach-box" id="attachment-layer">
            <input type="text" id="model_path" placeholder="/path/to/model/weights">
            <button class="btn btn-primary" id="attach_btn" onclick="attachModel()">Mount Payload</button>
            <span id="attach_error" style="color: var(--danger); font-size: 0.8rem; margin-top: 5px;"></span>
        </div>

        <h4 style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px; border-bottom: 1px solid #262626; padding-bottom: 5px;">MOUNTED ARCHITECTURES</h4>
        <div id="model-list"></div>
    </nav>

    <main id="main-view">
        <div id="top-bar" style="display: none;">
            <div id="active-model-name" style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--success);">[NO ACTIVE POLICY]</div>
            <div class="shiva-metrics">
                <div class="metric">VALENCE_MOOD: <span id="ui-mood" style="color: var(--warning);">--</span></div>
                <div class="metric">SYS_AROUSAL: <span id="ui-arousal" style="color: var(--danger);">--</span></div>
                <div class="metric">MEM_BANK: <span id="ui-memory" style="color: var(--accent);">--</span></div>
            </div>
        </div>

        <div id="execution-log">
            <div class="empty-state" id="empty-state">
                <h1>Shiva execution engine</h1>
                <p>Awaiting local engine initialization and architecture mount.</p>
            </div>
        </div>

        <div id="input-container" style="display: none;">
            <div class="input-box">
                <span class="prompt-symbol">root@shiva:~#</span>
                <input type="text" id="directive-input" placeholder="Enter execution directive..." onkeydown="handleEnter(event)" autocomplete="off">
            </div>
        </div>
    </main>

    <script>
        const API_BASE = "http://localhost:5123";
        let activeModelId = null;

        function getTimestamp() {
            const now = new Date();
            return now.toISOString().split('T')[1].slice(0, 12);
        }

        // --- CORE LOGIC ---
        async function pingShiva() {
            const indicator = document.getElementById('indicator');
            try {
                const response = await fetch(`${API_BASE}/health-and-capability-check`);
                const data = await response.json();
                
                if (data.cognitive_state.status === "online") {
                    indicator.classList.add("online");
                    document.getElementById('attachment-layer').style.opacity = "1";
                    document.getElementById('attachment-layer').style.pointerEvents = "auto";
                    updateShivaMetrics(data.cognitive_state);
                    appendLog("SYS", "Daemon initialized. Awaiting payload mount.", "source-sys");
                }
            } catch (error) {
                alert("Connection failed. Ensure FastAPI is running on port 5123.");
                indicator.classList.remove("online");
            }
        }

        async function attachModel() {
            const pathInput = document.getElementById('model_path').value;
            const errorSpan = document.getElementById('attach_error');
            const btn = document.getElementById('attach_btn');
            
            if (!pathInput) { errorSpan.innerText = "Path required."; return; }
            errorSpan.innerText = ""; btn.innerText = "SCANNING..."; btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/frankenMerging`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: pathInput })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Unknown error");
                if (data.success) {
                    renderModelCard(data.model);
                    document.getElementById('model_path').value = "";
                    appendLog("SYS", `Successfully mapped architecture: ${data.model.name}`, "source-sys");
                }
            } catch (error) {
                errorSpan.innerText = error.message;
                appendLog("ERR", `Mount failed: ${error.message}`, "source-err");
            } finally {
                btn.innerText = "Mount Payload"; btn.disabled = false;
            }
        }

        async function triggerMerge(modelId, modelName) {
            const btn = document.getElementById(`btn_${modelId}`);
            btn.innerText = "EXECUTING SVD...";
            btn.disabled = true;
            appendLog("SYS", `Initiating FrankenMerge for ${modelName}. Running Truncated SVD...`, "source-sys");

            try {
                const response = await fetch(`${API_BASE}/${modelId}ModelMerge`);
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail);

                if (data.success) {
                    updateShivaMetrics(data.cognitive_state);
                    
                    btn.innerText = "POLICY ACTIVE";
                    btn.style.background = "var(--success)";
                    btn.style.color = "#000";
                    document.getElementById(`card_${modelId}`).classList.add('active');
                    
                    activateTerminal(modelId, modelName);
                    appendLog("EXE", `SVD Merge Complete. Policy active and bound to terminal.`, "source-exe");
                }
            } catch (error) {
                btn.innerText = "MERGE FAULT";
                btn.style.background = "var(--danger)";
                appendLog("ERR", `SVD Merge Failed: ${error.message}`, "source-err");
            }
        }

        // --- UI UPDATES ---
        function renderModelCard(model) {
            const list = document.getElementById('model-list');
            const meta = model.metadata;
            const isCompat = model.compatibility.is_compatible;
            
            const cardHtml = `
                <div class="model-card" id="card_${model.id}">
                    <h4>${model.name}</h4>
                    <div class="meta">${model.path}</div>
                    <div style="margin-bottom: 12px;">
                        <span class="tag">${meta.architecture}</span>
                        <span class="tag">${meta.parameters || meta.hidden_size + 'd'}</span>
                    </div>
                    ${isCompat ? 
                        `<button id="btn_${model.id}" class="btn" style="width: 100%; border-color: #5b21b6; color: #a78bfa;" onclick="triggerMerge('${model.id}', '${model.name}')">Ingest Weights</button>` : 
                        `<div style="color: var(--danger); font-size: 0.75rem; font-family: var(--font-mono);">[INCOMPATIBLE ARCHITECTURE]</div>`
                    }
                </div>
            `;
            list.innerHTML += cardHtml;
        }

        function updateShivaMetrics(state) {
            document.getElementById('ui-mood').innerText = state.emotional_state.current_mood.toUpperCase();
            document.getElementById('ui-arousal').innerText = state.emotional_state.drives.arousal.toFixed(3);
            document.getElementById('ui-memory').innerText = state.memory_bank_size;
        }

        function activateTerminal(modelId, modelName) {
            activeModelId = modelId;
            document.getElementById('top-bar').style.display = "flex";
            document.getElementById('input-container').style.display = "block";
            document.getElementById('empty-state').style.display = "none";
            document.getElementById('active-model-name').innerText = `[ACTIVE_POLICY: ${modelName.toUpperCase()}]`;
            document.getElementById('directive-input').focus();
        }

        // --- EXECUTION LOGIC ---
        function handleEnter(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                dispatchDirective();
            }
        }

        async function dispatchDirective() {
            const inputEl = document.getElementById('directive-input');
            const text = inputEl.value.trim();
            if (!text || !activeModelId) return;

            // 1. Log the User Directive
            appendLog("USR", text, "source-usr");
            inputEl.value = "";
            inputEl.disabled = true;
            
            // 2. Log Acknowledgment
            const processId = `proc_${Date.now()}`;
            appendLog("SYS", `[PID ${processId}] Directive accepted. Executing in background...`, "source-sys");

            // 3. Backend Execution Call (Updated Endpoint)
            try {
                const response = await fetch(`${API_BASE}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model_id: activeModelId, directive: text })
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.detail);
                
                // 4. Log the silent execution result
                appendLog("EXE", `[PID ${processId}] Execution Complete. Output logged to universal latent space.`, "source-exe");
                
                if (data.execution_summary) {
                    appendLog("SYS", `Summary: ${data.execution_summary}`, "source-sys");
                }

                updateShivaMetrics(data.cognitive_state);

            } catch (error) {
                appendLog("ERR", `[PID ${processId}] FATAL: ${error.message}`, "source-err");
            } finally {
                inputEl.disabled = false;
                inputEl.focus();
            }
        }

        function appendLog(source, content, sourceClass) {
            const logArea = document.getElementById('execution-log');
            
            // Remove empty state if it exists
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.style.display = 'none';

            const logHtml = `
                <div class="log-entry">
                    <span class="timestamp">[${getTimestamp()}]</span>
                    <span class="source ${sourceClass}">${source}</span>
                    <span class="content">${content}</span>
                </div>
            `;
            logArea.insertAdjacentHTML('beforeend', logHtml);
            logArea.scrollTop = logArea.scrollHeight;
        }
    </script>
</body>
</html>
