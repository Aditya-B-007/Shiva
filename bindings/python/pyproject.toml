[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shiva-ai"
version = "0.1.0"
authors = [
  { name = "Aditya Dhruva Bhaskara", email = "aditya@example.com" },
]
description = "Shiva 2.0 — Sub-millisecond cognitive operating system & 5-node autonomous runtime"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/Aditya-B-007/Shiva"
"Bug Tracker" = "https://github.com/Aditya-B-007/Shiva/issues"

[tool.setuptools]
py-modules = ["shiva"]
